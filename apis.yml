name: Pixcel
description: 'PIXCEL Inc. is an early-stage deep-tech startup developing cutting-edge
  silicon photonics solutions and photonic integrated circuits (PICs) for optical
  communications and related systems. Based in Matawan, NJ, and co-founded by silicon
  photonics veteran Long Chen (previously at Cisco Systems and Acacia Communications),
  the company designs passive and active photonic components and collaborates with
  foundry partners to optimize process design kits (PDKs). PIXCEL is a hardware and
  semiconductor company with no public API, developer portal, or software product
  surface at this time; it was surfaced as a portfolio company of Matrix Partners and
  added to the API Evangelist network as a lead. This profile reflects an enrichment
  pass that confirmed there is no API surface to catalog.'
